<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VinilPlayer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b0b0b'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23fff' stroke-opacity='.1'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23d7263d'/%3E%3Ccircle cx='16' cy='16' r='1.3' fill='%230b0b0b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<img class="bg" alt="" aria-hidden="true">
<main class="wrap" data-state="loading" data-playing="false" data-has-cover="false" data-has-artist="false" data-fs="off" data-view="vinil">
  <header class="top">
    <div class="top__l">
      <span>tocando agora</span>
      <span class="top__artist"></span>
      <span class="top__album"></span>
    </div>
    <div class="top__r">
      <button type="button" class="viewtoggle" data-tip aria-label="Trocar visualiza&ccedil;&atilde;o">
        <svg class="vt-vinil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/></svg>
        <svg class="vt-capa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
      <button type="button" class="fs" data-tip aria-label="Tela cheia">
        <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </div>
  </header>

  <div class="stage">
    <div class="sleeve">
      <img class="sleeve__img" alt="">
      <div class="sleeve__ph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.8"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <span>capa do &aacute;lbum</span>
      </div>
    </div>
    <!-- disco, sombra e braco sao decoracao: o que eles representam (faixa,
         album, se esta tocando) ja e texto em outro lugar da tela. -->
    <div class="turntable" aria-hidden="true">
      <div class="disc-shadow"></div>
      <div class="disc3d">
        <div class="disc">
          <div class="disc__label">
            <img class="disc__label-img" alt="" hidden>
            <i class="disc__hole"></i>
          </div>
        </div>
      </div>
      <div class="tonearm">
        <i class="tonearm__weight"></i>
        <i class="tonearm__pivot"></i>
        <i class="tonearm__head"></i>
      </div>
    </div>

    <section class="now" aria-live="polite">
      <h1 class="now__title"></h1>
    </section>

    <div class="artist"><img class="artist__img" alt=""></div>
  </div>

  <div class="ctrls">
    <button type="button" class="ctrl ctrl--txt" data-tip data-act="prev" aria-label="Faixa anterior">ant</button>
    <button type="button" class="ctrl ctrl--main" data-tip data-act="toggle" aria-label="Pausar">pause</button>
    <button type="button" class="ctrl ctrl--txt" data-tip data-act="next" aria-label="Pr&oacute;xima faixa">pr&oacute;x</button>
  </div>
  <p class="hint" role="status"></p>

  <ol class="tracks" aria-label="Faixas do &aacute;lbum"></ol>

  <div class="status" aria-live="polite">
    <span class="status__text"></span>
    <button type="button" class="btn retry">tentar de novo</button>
    <button type="button" class="btn primary connect-btn">Conectar ao Spotify</button>
  </div>

  <button type="button" class="disconnect" data-tip="up" aria-label="Desconectar: sai da conta e volta pra tela de conex&atilde;o">desconectar</button>
</main>

<script src="app.js"></script>
</body>
</html>
